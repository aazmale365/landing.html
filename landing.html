<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aazmale365 Hub</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #000000, #1a0000, #001a0f);
  color: white;
  text-align: center;
}

/* Background text FIXED */
body::before {
  content: "SINCE 2023";
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 60px;
  color: rgba(255, 0, 0, 0.05);
  z-index: -1; /* FIX CLICK ISSUE */
}

/* Header */
.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 20px;
}

.logo {
  width: 90px;
}

h1 {
  margin: 5px 0;
  font-size: 30px;
  animation: glow 1.5s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px red; }
  to { text-shadow: 0 0 25px red, 0 0 40px #ff0000; }
}

/* OFFER BOX (GOLD) */
.offer-box {
  margin: 15px auto;
  width: 85%;
  max-width: 320px;
  padding: 15px;
  background: linear-gradient(135deg, #1a0f00, #332100);
  border-radius: 12px;
  border: 1px solid gold;
  box-shadow: 0 0 15px rgba(255,215,0,0.5);
  animation: glowBox 2s infinite alternate;
}

.offer-box h2 {
  font-size: 18px;
  color: gold;
}

.offer-box p {
  font-size: 14px;
  color: #eee;
}

@keyframes glowBox {
  from { box-shadow: 0 0 10px gold; }
  to { box-shadow: 0 0 25px gold; }
}

/* GRID LAYOUT */
.container {
  margin-top: 25px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 10px;
}

/* BEST SITE */
.featured {
  grid-column: span 2;
  display: block;
  padding: 16px;
  background: linear-gradient(135deg, #0f1f14, #001a0f);
  border-radius: 12px;
  text-decoration: none;
  color: white;
  font-size: 16px;
  border: 2px solid #22c55e;
  box-shadow: 0 0 15px rgba(34,197,94,0.5);
}

.badge {
  background: #22c55e;
  color: black;
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 12px;
}

/* NORMAL CARDS */
.card {
  display: block;
  padding: 14px;
  background: #111;
  border-radius: 12px;
  text-decoration: none;
  color: white;
  font-size: 14px;
  border: 1px solid #222;
  transition: 0.2s;
}

/* CLICK EFFECT */
.card:active,
.featured:active {
  transform: scale(0.95);
  opacity: 0.8;
}

/* HOVER */
.card:hover {
  border-color: gold;
  transform: scale(1.05);
}

/* WhatsApp */
.whatsapp {
  border: 1px solid #25D366;
}

/* Telegram */
.telegram {
  border: 1px solid #229ED9;
}

/* Icons */
.icon {
  width: 18px;
  vertical-align: middle;
  margin-right: 6px;
}
</style>

</head>

<body>

<div class="header">

  <h1>⚡ Aazmale365 ⚡</h1>

  <p>💰 10% First Deposit Bonus</p>
  <p>🔄 5% Every Deposit</p>
  <p>🎯 10% Losing Cashback</p>
</div>

<div class="container">

  <!-- BEST SITE -->
  <a class="featured" href="https://www.aazmale365.co">
    <div class="badge">🔥 BEST SITE</div><br>
    🌐 Aazmale365.co
  </a>

  <!-- Other sites -->
  <a class="card" href="https://www.aazmale365.net">🌐 Aazmale365.net</a>
  <a class="card" href="https://www.aazmale365.io">🌐 Aazmale365.io</a>
  <a class="card" href="https://www.aazmale365.club">🌐 Aazmale365.club</a>

  <!-- Tools -->
  <a class="card whatsapp" href="https://aazmale365.github.io/whatsapp-link-API/Api.html">
    <img class="icon" src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
    WhatsApp
  </a>

  <a class="card telegram" href="https://t.me/aazmale365official">
    <img class="icon" src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png">

  </a>

</div>

</body>
</html>
